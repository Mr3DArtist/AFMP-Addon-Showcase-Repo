<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>More from Mr3D</title>
<style>
/* ============================================================
   THEME TOKENS (shared with the parent pages)
   ============================================================ */
:root {
  --color-primary:   hsl(133, 50%, 90%);
  --color-secondary: hsl(133, 50%, 10%);
  --color-tertiary:  hsl(193, 80%, 20%);
  --color-accent:    hsl(73, 80%, 20%);
}
.dark {
  --color-primary:   hsl(133, 50%, 10%);
  --color-secondary: hsl(133, 50%, 90%);
  --color-tertiary:  hsl(193, 80%, 80%);
  --color-accent:    hsl(73, 80%, 80%);
}
:root {
  --bg:             var(--color-primary);
  --ink:            var(--color-secondary);
  --card-bg:        hsl(133, 42%, 97%);
  --card-bg-strong: hsl(133, 40%, 92%);
  --border:         color-mix(in srgb, var(--ink) 14%, transparent);
  --border-strong:  color-mix(in srgb, var(--ink) 32%, transparent);
  --muted:          color-mix(in srgb, var(--ink) 62%, transparent);
  --glow-tertiary:  color-mix(in srgb, var(--color-tertiary) 38%, transparent);
  --glow-accent:    color-mix(in srgb, var(--color-accent) 30%, transparent);
  --grad-brand:     linear-gradient(120deg, var(--color-tertiary), var(--color-accent));
}
.dark {
  --card-bg:        hsl(133, 42%, 14%);
  --card-bg-strong: hsl(133, 38%, 17%);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: transparent;
  color: var(--ink);
  line-height: 1.5;
  transition: background .4s ease, color .4s ease;
}
.container { width: 100%; padding: 8px 2px; }

/* ---------- head row ---------- */
.gallery-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
.g-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(1.05rem, 2vw, 1.4rem); letter-spacing: -.02em; margin: .35rem 0 .1rem; }
.g-sub { font-size: .82rem; color: var(--muted); }
.kicker { display: inline-flex; align-items: center; gap: .45rem; font-size: .7rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--color-tertiary); }
.kicker::before { content: ''; width: 22px; height: 2px; background: var(--grad-brand); border-radius: 2px; }
.gallery-controls { display: flex; gap: .45rem; flex: none; }
.g-arrow { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; cursor: pointer; background: var(--card-bg); border: 1px solid var(--border-strong); color: var(--ink); transition: transform .2s ease, border-color .2s ease, opacity .2s ease; }
.g-arrow:hover { transform: translateY(-2px); border-color: var(--color-tertiary); }
.g-arrow:disabled { opacity: .35; cursor: default; transform: none; }
.g-arrow svg { width: 17px; height: 17px; }

/* ---------- track ---------- */
.gallery-viewport { position: relative; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; scroll-snap-type: x mandatory; scroll-behavior: smooth; cursor: grab; }
.gallery-viewport::-webkit-scrollbar { display: none; }
.gallery-track { --g-gap: 1.1rem; display: flex; gap: var(--g-gap); list-style: none; padding: 6px 2px 24px; }
.g-card { flex: 0 0 calc((100% - 4 * var(--g-gap)) / 5); scroll-snap-align: start; min-width: 0; }
@media (max-width: 1000px) { .g-card { flex: 0 0 calc((100% - 2 * var(--g-gap)) / 3); } }
@media (max-width: 640px) { .g-card { flex: 0 0 calc((100% - 1 * var(--g-gap)) / 2); } }
@media (max-width: 420px) { .g-card { flex: 0 0 82%; } }
.g-thumb { display: block; text-decoration: none; color: inherit; }
.g-frame { position: relative; display: block; border-radius: 16px; overflow: hidden; aspect-ratio: 4 / 3; border: 1px solid var(--border-strong); background: var(--card-bg); box-shadow: 0 14px 32px -20px color-mix(in srgb, var(--ink) 22%, transparent); }
.g-ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink); transition: transform .55s cubic-bezier(.22,.61,.36,1); }
.g-thumb:hover .g-ph { transform: scale(1.08); }
.g-ph svg { width: 32px; height: 32px; opacity: .85; }
.g-ph-tag { position: absolute; left: 4px; bottom: 3px; font-size: .76rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: .12rem .38rem; border-radius: 12px; background: linear-gradient(140deg, #0d2b21, #143a2e) padding-box, linear-gradient(135deg, #22d3ee, #34d399, #fde047) border-box; border: 2px solid transparent; color: #fff; }
.gp-1 { background: radial-gradient(60% 60% at 30% 30%, var(--glow-tertiary), transparent 70%), linear-gradient(140deg, #163a33, #0b1f1a); }
.gp-2 { background: radial-gradient(60% 60% at 70% 30%, var(--glow-accent), transparent 70%), linear-gradient(140deg, #3a3a16, #1a1a08); }
.gp-3 { background: radial-gradient(60% 60% at 30% 70%, var(--glow-accent), transparent 70%), linear-gradient(140deg, #143a42, #081c21); }
.gp-4 { background: radial-gradient(60% 60% at 70% 70%, var(--glow-tertiary), transparent 70%), linear-gradient(140deg, #243a16, #0f1c08); }
.gp-5 { background: radial-gradient(60% 60% at 50% 30%, var(--glow-tertiary), transparent 70%), linear-gradient(140deg, #163a42, #081c21); }
.gp-6 { background: radial-gradient(60% 60% at 50% 70%, var(--glow-accent), transparent 70%), linear-gradient(140deg, #3a2a16, #1a1208); }
.gallery-dots { display: flex; justify-content: center; gap: .5rem; }
.g-dot { width: 8px; height: 8px; border-radius: 999px; border: 0; padding: 0; cursor: pointer; background: color-mix(in srgb, var(--ink) 22%, transparent); transition: width .3s ease, background .3s ease; }
.g-dot.active { width: 26px; background: var(--color-tertiary); }

/* ---------- particles ---------- */
.section-particles { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.gallery-wrap { position: relative; }
.gallery-wrap .container { position: relative; z-index: 1; }
</style>
</head>
<body>
<!-- Theme: read shared key, update on message from parent -->
<script>
(function () {
  var r = document.documentElement;
  function apply(dark) { r.classList.toggle('dark', !!dark); }
  var s = localStorage.getItem('mr3d-theme');
  apply(s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'theme') { apply(e.data.dark); localStorage.setItem('mr3d-theme', e.data.dark ? 'dark' : 'light'); }
  });
})();
</script>

<!-- ============================================================

<div class="gallery-wrap">

<script>
/* ============================================================
   PARTICLES + CAROUSEL
   ============================================================ */
(function () {
  'use strict';
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cols = { teal: '#000', olive: '#000' };
  function getCols() {
    var cs = getComputedStyle(document.documentElement);
    cols.teal = cs.getPropertyValue('--color-tertiary').trim() || '#000';
    cols.olive = cs.getPropertyValue('--color-accent').trim() || '#000';
  }
  getCols();

  /* particles */
  document.querySelectorAll('.section-particles').forEach(function (canvas) {
    var ctx = canvas.getContext('2d');
    var section = canvas.parentElement;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var parts = [], w = 0, h = 0, mX = -9999, mY = -9999;
    function make() {
      return { x: Math.random() * w, y: Math.random() * h, r: 0.8 + Math.random() * 1.6, hue: Math.random() > 0.5 ? 'teal' : 'olive', vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3, ph: Math.random() * 6.28 };
    }
    function size() {
      var r = section.getBoundingClientRect();
      w = r.width; h = r.height;
      canvas.width = Math.max(1, Math.round(w * dpr));
      canvas.height = Math.max(1, Math.round(h * dpr));
      canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = Math.max(16, Math.min(110, Math.round(w * h / 15000)) * 2);
      if (parts.length !== n) { parts = []; for (var i = 0; i < n; i++) parts.push(make()); }
    }
    function draw() {
      ctx.clearRect(0, 0, w, h);
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        p.ph += 0.008; p.x += p.vx + Math.sin(p.ph) * 0.2; p.y += p.vy;
        if (p.x < -20) p.x = w + 20; else if (p.x > w + 20) p.x = -20;
        if (p.y < -20) p.y = h + 20; else if (p.y > h + 20) p.y = -20;
        var dx = p.x - mX, dy = p.y - mY, d = Math.sqrt(dx * dx + dy * dy);
        if (d < 130 && d > 0.1) { p.x += (dx / d) * 1.5; p.y += (dy / d) * 1.5; }
      }
      for (i = 0; i < parts.length; i++) {
        var q = parts[i];
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = q.hue === 'olive' ? cols.olive : cols.teal;
        ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    function loop() { draw(); requestAnimationFrame(loop); }
    section.addEventListener('mousemove', function (e) { var r = canvas.getBoundingClientRect(); mX = e.clientX - r.left; mY = e.clientY - r.top; });
    section.addEventListener('mouseleave', function () { mX = -9999; mY = -9999; });
    size();
    if (reduceMotion) draw(); else loop();
    window.addEventListener('resize', size);
  });

  /* carousel */
  var viewport = document.getElementById('gViewport');
  if (!viewport) return;
  var track = document.getElementById('gTrack');
  var prevBtn = document.getElementById('gPrev');
  var nextBtn = document.getElementById('gNext');
  var dotsWrap = document.getElementById('gDots');
  var cards = track ? track.children : [];
  function gVisible() { var w = viewport.clientWidth; if (w <= 420) return 1; if (w <= 640) return 2; if (w <= 1000) return 3; return 5; }
  function gMaxIndex() { return Math.max(0, cards.length - gVisible()); }
  function gPositions() { var a = []; Array.prototype.forEach.call(cards, function (c) { a.push(c.offsetLeft); }); return a; }
  function gCurrent() { var s = viewport.scrollLeft, a = gPositions(), b = 0; for (var i = 0; i < a.length; i++) if (Math.abs(a[i] - s) < Math.abs(a[b] - s)) b = i; return b; }
  function gGo(i) { i = Math.max(0, Math.min(gMaxIndex(), i)); var a = gPositions(); viewport.scrollTo({ left: a[i] || 0, behavior: reduceMotion ? 'auto' : 'smooth' }); }
  prevBtn.addEventListener('click', function () { gGo(gCurrent() - 1); });
  nextBtn.addEventListener('click', function () { gGo(gCurrent() + 1); });
  function gRenderDots() {
    dotsWrap.innerHTML = '';
    var n = gMaxIndex() + 1;
    for (var i = 0; i < n; i++) (function (idx) { var b = document.createElement('button'); b.className = 'g-dot' + (idx === 0 ? ' active' : ''); b.setAttribute('aria-label', 'Gallery page ' + (idx + 1)); b.addEventListener('click', function () { gGo(idx); gRestart(); }); dotsWrap.appendChild(b); })(i);
  }
  function gUpdate() {
    var cur = gCurrent(), dots = dotsWrap.children;
    for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('active', i === cur);
    prevBtn.disabled = cur <= 0; nextBtn.disabled = cur >= gMaxIndex();
    var overflow = viewport.scrollWidth > viewport.clientWidth + 1;
    prevBtn.style.display = overflow ? '' : 'none';
    nextBtn.style.display = overflow ? '' : 'none';
    dotsWrap.style.display = overflow ? '' : 'none';
  }
  viewport.addEventListener('scroll', gUpdate, { passive: true });
  if (window.matchMedia('(pointer: fine)').matches) {
    var down = false, sx = 0, ss = 0;
    viewport.addEventListener('pointerdown', function (e) { if (e.button !== 0) return; down = true; sx = e.clientX; ss = viewport.scrollLeft; gStop(); });
    window.addEventListener('pointermove', function (e) { if (!down) return; viewport.scrollLeft = ss - (e.clientX - sx); });
    window.addEventListener('pointerup', function () { down = false; gRestart(); });
  }
  viewport.addEventListener('touchstart', gStop, { passive: true });
  viewport.addEventListener('touchend', gRestart, { passive: true });
  viewport.addEventListener('mouseenter', gStop);
  viewport.addEventListener('mouseleave', gRestart);
  var timer = null;
  function gStop() { clearInterval(timer); timer = null; }
  function gRestart() { gStop(); if (reduceMotion) return; timer = setInterval(function () { if (document.hidden) return; var c = gCurrent(); if (c >= gMaxIndex()) gGo(0); else gGo(c + 1); }, 4200); }
  gRenderDots(); gUpdate(); gRestart();
  window.addEventListener('resize', function () { gRenderDots(); gUpdate(); });
  window.addEventListener('message', function (e) { if (e.data && e.data.type === 'theme') { getCols(); } });
})();
</script>
</body>
